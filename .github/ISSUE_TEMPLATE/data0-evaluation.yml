name: DATA0 Engineering Evaluation
description: Request a bounded evaluation, PoC, adaptation or integration discussion for DATA0-ES.
title: "[DATA0 Evaluation] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Use this form to describe a concrete need related to DATA0-ES.

        Review the DATA0 Engineering Evaluation Process before submitting:
        https://github.com/f8tf-bouhdadi/f8tf-engineering-fabric/blob/main/engineering-pocs/DATA0_EVALUATION_PROCESS.md

        Do not include confidential, personal or security-sensitive information.
        Submission of this form does not create a commercial contract or guarantee access to a delivery.

  - type: dropdown
    id: engagement
    attributes:
      label: Requested engagement
      description: What kind of interaction are you requesting?
      options:
        - Initial fit assessment
        - Controlled evaluation delivery
        - Scoped Engineering PoC
        - Client-specific adaptation
        - Integration discussion
        - Commercial proposal
    validations:
      required: true

  - type: dropdown
    id: client_role
    attributes:
      label: Client role
      description: Which role best describes the requester?
      options:
        - Platform provider
        - Systems integrator
        - Engineering or development team
        - Auditor or compliance team
        - Operator
        - Procurement or decision-maker
        - Research or evaluation team
        - Other
    validations:
      required: true

  - type: textarea
    id: client_need
    attributes:
      label: Client need
      description: Describe the concrete engineering problem you need to address.
      placeholder: We need to preserve...
    validations:
      required: true

  - type: textarea
    id: scenario
    attributes:
      label: Evaluation scenario
      description: Describe the bounded scenario that DATA0-ES should support.
      placeholder: The service receives..., records..., and the client verifies...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Target environment
      description: Identify the relevant operating system, runtime, platform and integration constraints.
      placeholder: Windows or Linux, .NET version, deployment context, existing systems...
    validations:
      required: true

  - type: checkboxes
    id: guarantees
    attributes:
      label: Guarantees to evaluate
      description: Select the DATA0 behaviors relevant to your need.
      options:
        - label: Required payload validation
        - label: Append-only recording
        - label: Preservation of previously recorded data
        - label: Scoped monotonic offsets
        - label: Minimal persistence traceability
        - label: Reproducible client verification

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: State the observable results required for a successful evaluation.
      placeholder: The evaluation is accepted when...
    validations:
      required: true

  - type: checkboxes
    id: limitations
    attributes:
      label: Scope acknowledgement
      description: Confirm that you reviewed the currently declared DATA0 limitations.
      options:
        - label: I reviewed the DATA0 guarantees and limitations published in the repository.
          required: true
        - label: I understand that this request does not itself create a contract or guarantee unrestricted delivery access.
          required: true

  - type: dropdown
    id: expected_decision
    attributes:
      label: Expected decision
      description: What decision should this evaluation support?
      options:
        - Determine whether DATA0 fits the need
        - Decide whether to request a scoped PoC
        - Decide whether adaptation is required
        - Decide whether integration should begin
        - Decide whether to request a commercial proposal
        - Compare DATA0 with another solution
        - Other
    validations:
      required: true

  - type: input
    id: timeframe
    attributes:
      label: Requested timeframe
      description: Identify any relevant evaluation or decision date.
      placeholder: "Example: evaluation during September 2026"
    validations:
      required: false

  - type: checkboxes
    id: data_sensitivity
    attributes:
      label: Evaluation data
      description: Confirm the type of data intended for the evaluation.
      options:
        - label: The evaluation will use only fictitious, public or non-sensitive data.
          required: true
        - label: No credentials, secrets, personal data or production data will be submitted through this public request.
          required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional information
      description: Add relevant non-confidential constraints, expected dates or questions.
